<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Verses & Vibes and Little Mumin Book Club." />
	<title>Book Club | Ihsaanah</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ihsaanah-gold': '#C9A030',
              'ihsaanah-gold-light': '#f5ede0',
              'ihsaanah-black': '#0D0D0D',
              'ihsaanah-cream': '#faf7f2',
            },
            fontFamily: {
              heading: ['Poppins', 'Segoe UI', 'sans-serif'],
              body: ['Inter', 'Segoe UI', 'sans-serif'],
            },
          },
        },
      };
    </script>
	<link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
</head>
<body class="flex min-h-screen flex-col bg-ihsaanah-cream text-ihsaanah-black font-body" data-active-nav="book-club.html">
	<div id="site-header"></div>
	<main class="flex-1">
		<section class="relative overflow-hidden bg-ihsaanah-black py-20 text-white">
			<div class="ihsaanah-pattern-gold pointer-events-none absolute inset-0 opacity-[0.12]"></div>
			<div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60"></div>
			<div class="relative mx-auto max-w-4xl px-4 text-center">
				<div class="mb-5 flex items-center justify-center gap-4">
					<div class="h-px w-14 bg-gradient-to-r from-transparent to-ihsaanah-gold/60"></div>
					<div class="h-2 w-2 rotate-45 bg-ihsaanah-gold opacity-80"></div>
					<div class="h-px w-14 bg-gradient-to-l from-transparent to-ihsaanah-gold/60"></div>
				</div>
				<h1 class="font-heading text-3xl font-bold text-white sm:text-4xl animate-fade-up">Book Club</h1>
			</div>
		</section>
		<section class="mx-auto max-w-4xl px-4 py-14">
			<div class="grid gap-6 sm:grid-cols-2">
			<div class="ihsaanah-card flex flex-col overflow-hidden rounded-lg border border-ihsaanah-gold-light bg-white p-5 shadow-sm" data-aos="fade-up" data-aos-delay="0">
				<h3 class="font-heading text-lg font-semibold text-ihsaanah-black">Verses & Vibes</h3>
				<p class="mt-2 flex-1 text-sm text-ihsaanah-black/70">Placeholder description once supplied.</p>
			</div>
			<div class="ihsaanah-card flex flex-col overflow-hidden rounded-lg border border-ihsaanah-gold-light bg-white p-5 shadow-sm" data-aos="fade-up" data-aos-delay="150">
				<h3 class="font-heading text-lg font-semibold text-ihsaanah-black">Little Mumin Book Club</h3>
				<p class="mt-2 flex-1 text-sm text-ihsaanah-black/70">Placeholder description once supplied.</p>
			</div>
			</div>
		</section>
	</main>
	<div id="site-footer"></div>
	<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
	<script src="js/main.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <!-- Cooler dark background gradient -->
    <radialGradient id="r-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#080f14"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <!-- Teal-gold glow behind head -->
    <radialGradient id="r-glow" cx="50%" cy="36%" r="38%">
      <stop offset="0%" stop-color="#C9A030" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9A030" stop-opacity="0"/>
    </radialGradient>
    <!-- Skin tone gradient — slightly warmer/deeper -->
    <radialGradient id="r-skin" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c8966a"/>
      <stop offset="100%" stop-color="#a87040"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="url(#r-bg)"/>
  <rect width="300" height="400" fill="url(#r-glow)"/>

  <!-- Subtle outer frame -->
  <rect x="8" y="8" width="284" height="384" fill="none"
        stroke="#C9A030" stroke-width="0.6" stroke-opacity="0.18"/>

  <!-- Body — dark modest dress, slight asymmetry for variety -->
  <path d="M0 400 L30 268 Q55 242 150 235 Q245 242 270 268 L300 400 Z"
        fill="#0c1018"/>
  <!-- Gold neckline accent -->
  <path d="M115 240 Q150 252 185 240"
        stroke="#C9A030" stroke-width="1.2" fill="none" stroke-opacity="0.4"/>

  <!-- Neck -->
  <ellipse cx="150" cy="228" rx="21" ry="14" fill="#a87040" opacity="0.65"/>

  <!-- Hijab — DRAPED / flowing style, falls over one shoulder more
       Different from Zoomana: looser, more flowing drape  -->
  <!-- Back layer — slightly larger, darker -->
  <path d="M55 205
           Q52 148 75 115
           Q104 76 150 72
           Q196 76 225 115
           Q248 148 245 205
           Q238 238 210 250
           Q185 258 165 260
           Q145 262 125 258
           Q95 252 72 238
           Q58 228 55 205 Z"
        fill="#111820"/>
  <!-- Front drape — asymmetric fall to right shoulder -->
  <path d="M150 252 Q175 258 200 255 Q230 248 245 220 Q250 238 248 260 Q235 278 200 282 Q170 285 150 280 Z"
        fill="#0d1520"/>
  <!-- Hijab fold highlight on left side -->
  <path d="M72 190 Q68 215 72 238"
        stroke="#C9A030" stroke-width="0.6" fill="none" stroke-opacity="0.18"/>
  <!-- Hijab fold highlight — soft diagonal line suggesting drape -->
  <path d="M115 175 Q135 185 148 200"
        stroke="#C9A030" stroke-width="0.5" fill="none" stroke-opacity="0.15"/>

  <!-- Face oval — smooth, no features -->
  <ellipse cx="150" cy="158" rx="54" ry="64" fill="url(#r-skin)"/>

  <!-- Hijab cap — sits on forehead, slightly different shape from Zoomana -->
  <path d="M96 138
           Q110 82 150 76
           Q190 82 204 138
           Q182 124 150 122
           Q118 124 96 138 Z"
        fill="#0b1018"/>

  <!-- Small gold decorative element — different position from Zoomana:
       a subtle pin on the right side of hijab -->
  <circle cx="198" cy="190" r="3.5" fill="#C9A030" opacity="0.6"/>
  <circle cx="198" cy="190" r="2"   fill="#e8c060"/>
  <!-- Tiny diamond shape beside it -->
  <path d="M206 190 L209 187 L212 190 L209 193 Z"
        fill="#C9A030" opacity="0.35"/>

  <!-- Bottom decorative gold rule — different pattern from Zoomana -->
  <line x1="80" y1="385" x2="220" y2="385"
        stroke="#C9A030" stroke-width="0.5" stroke-opacity="0.22"/>
  <rect x="146" y="382.5" width="8" height="5"
        fill="none" stroke="#C9A030" stroke-width="0.5" stroke-opacity="0.22"
        transform="rotate(45 150 385)"/>
</svg>
